[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:raceday-api]
command=dotnet /app/api/RaceDay.Api.dll
directory=/app/api
environment=ASPNETCORE_URLS="http://+:8081",ASPNETCORE_ENVIRONMENT="Production"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:raceday-mvc]
command=dotnet /app/mvc/RaceDay.Mvc.dll
directory=/app/mvc
environment=ASPNETCORE_URLS="http://+:8080",ASPNETCORE_ENVIRONMENT="Production",ApiSettings__BaseUrl="http://localhost:8081/"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
