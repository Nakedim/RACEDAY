name: Part 1 Documentation Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks out your repository
      - uses: actions/checkout@v4

      # Runs a simple command
      - name: Run a one-line script
        run: echo "Hello, world!"

      # Check if the Projectfiles folder exists
      - name: Check documentation folder
        run: test -d Projectfiles

      # Check if the updated ERD/database SQL file exists
      - name: Check ERD SQL file
        run: test -f Projectfiles/RacedayDb.sql

      # Check API document
      - name: Check API Document
        run: test -f Projectfiles/POEPart1APIEndpointtable.pdf

      # Check ERD Document
      - name: Check ERD Document
        run: test -f Projectfiles/RacedayPOEPart1ERD.pdf

      # Check C# project
      - name: Check C# project
        run: dotnet build

      # Runs multiple commands
      - name: Run a multi-line script
        run: |
          echo "Add other actions to build,"
          echo "test, and deploy your project."
