name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-integration-tests:
    name: Database, Authentication & Unit Tests
    runs-on: ubuntu-latest

    # SQL Server 2022
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 1433:1433

    # Environment configuration
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RacedayDb;User Id=sa;Password=${{ secrets.DB_PASSWORD }};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Secret: "LocalTestingKeyMustBeAtLeast32CharactersLong123!"
      ASPNETCORE_ENVIRONMENT: Testing

    steps:
      # --------------------------------------------------
      # 1. CHECKOUT SOURCE CODE
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. SETUP .NET 9
      # --------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # --------------------------------------------------
      # 3. VALIDATE DATABASE PASSWORD
      # --------------------------------------------------
      - name: Validate database configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MSSQL_SA_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD GitHub secret is missing."
            exit 1
          fi
          echo "Database password configuration found."

      # --------------------------------------------------
      # 4. RESTORE AND BUILD API PROJECT
      # --------------------------------------------------
      - name: Restore API dependencies
        run: |
          dotnet restore RaceDay.Api/RaceDay.Api.csproj

      - name: Build API project
        run: |
          dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      # --------------------------------------------------
      # 5. INSTALL ENTITY FRAMEWORK TOOLS & GENERATE SCRIPT
      # --------------------------------------------------
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef
        
      - name: Generate EF Core migration script
        shell: bash
        run: |
          set -euo pipefail
          
          # Add the global tools directory to the PATH so bash can find 'dotnet-ef'
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet ef migrations script \
            --project RaceDay.Api/RaceDay.Api.csproj \
            --startup-project RaceDay.Api/RaceDay.Api.csproj \
            --configuration Release \
            --idempotent \
            --no-build \
            --output RaceDay.Api/RaceDayDB_v2.sql

          echo "Migration script generated successfully."

      # --------------------------------------------------
      # 6. WAIT FOR SQL SERVER AND INITIALIZE DATABASE
      # --------------------------------------------------
      - name: Initialize SQL Server database
        shell: bash
        run: |
          set -euo pipefail

          SQL_IMAGE="mcr.microsoft.com/mssql/server:2022-latest"

          CONTAINER_ID=$(docker ps \
            --filter "ancestor=$SQL_IMAGE" \
            --format "{{.ID}}" | head -n 1)

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: SQL Server container was not found."
            exit 1
          fi

          echo "SQL Server container: $CONTAINER_ID"

          # Wait for SQL Server to become available.
          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER_ID" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C \
              -b \
              -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "ERROR: SQL Server failed to start."
              docker logs "$CONTAINER_ID"
              exit 1
            fi

            echo "Waiting for SQL Server ($attempt/60)..."
            sleep 5
          done

          # Create database if it does not exist.
          echo "Creating RacedayDb if necessary..."
          docker exec "$CONTAINER_ID" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -Q "IF DB_ID(N'RacedayDb') IS NULL CREATE DATABASE [RacedayDb];"

          # Copy migration script into SQL Server container.
          echo "Copying migration script..."
          docker cp \
            RaceDay.Api/RaceDayDB_v2.sql \
            "$CONTAINER_ID:/tmp/RaceDayDB_v2.sql"

          # Execute migrations against RacedayDb.
          echo "Applying EF Core migrations..."
          docker exec "$CONTAINER_ID" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -d RacedayDb \
            -i /tmp/RaceDayDB_v2.sql

          echo "Database initialized successfully."

      # --------------------------------------------------
      # 7. RESTORE, BUILD AND TEST
      # --------------------------------------------------
      - name: Restore, build and test
        shell: bash
        run: |
          set -euo pipefail

          # Look for solution file.
          SOLUTION=$(find . -maxdepth 4 \
            \( -name '*.sln' -o -name '*.slnx' \) \
            -print -quit)

          if [ -n "$SOLUTION" ]; then
            echo "Solution found: $SOLUTION"

            # Restore all solution dependencies.
            dotnet restore "$SOLUTION"

            # Build solution.
            dotnet build "$SOLUTION" \
              --configuration Release \
              --no-restore

            # Execute all solution tests.
            dotnet test "$SOLUTION" \
              --configuration Release \
              --no-build \
              --no-restore \
              --verbosity normal
          else
            echo "No solution file found."

            # Locate API project.
            API_PROJECT=$(find . -maxdepth 4 \
              -name 'RaceDay.Api.csproj' \
              -print -quit)

            if [ -z "$API_PROJECT" ]; then
              echo "ERROR: API project not found."
              exit 1
            fi

            # Build API.
            dotnet restore "$API_PROJECT"
            dotnet build "$API_PROJECT" \
              --configuration Release \
              --no-restore

            # Locate test projects.
            mapfile -t TEST_PROJECTS < <(
              find . -maxdepth 5 \
                -name '*Tests.csproj' \
                -print
            )

            if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
              echo "ERROR: No test projects found."
              exit 1
            fi

            # Restore, build and test each project.
            for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "Testing: $TEST_PROJECT"
              dotnet restore "$TEST_PROJECT"
              dotnet build "$TEST_PROJECT" \
                --configuration Release \
                --no-restore
              dotnet test "$TEST_PROJECT" \
                --configuration Release \
                --no-build \
                --no-restore \
                --verbosity normal
            done
          fi

      # --------------------------------------------------
      # 8. PIPELINE SUCCESS
      # --------------------------------------------------
      - name: Pipeline completed
        if: success()
        run: |
          echo "========================================="
          echo "Pipeline finished successfully!"
          echo "========================================="
