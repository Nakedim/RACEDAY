name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  api-integration-tests:
    name: Database, Auth & Unit Testing
    runs-on: ubuntu-latest

    # Spin up an isolated SQL Server instance alongside your test runner
    services:
      sqlserver:
        image: ://microsoft.com
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourSecurePassword123!"
        ports:
          - 1433:1433
        # Ensure SQL Server is fully healthy before starting steps
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourSecurePassword123!' -C -Q 'SELECT 1'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Seed the SQL container using your database script from Part 1
      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y mssql-tools18 unixodbc-dev
          /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "YourSecurePassword123!" -C -i Projectfiles/RacedayDb.sql

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      # Runs your Controller logic, DTO mappings, and Role Authentication unit tests
      - name: Run Unit & Authentication Tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RacedayDb;User Id=sa;Password=YourSecurePassword123!;Encrypt=True;TrustServerCertificate=True;"
          Jwt__Secret: "SuperSecretKeyForTestingPurposesOnly123!"
