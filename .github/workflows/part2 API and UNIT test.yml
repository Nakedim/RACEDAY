name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Only run this job when either it's not a pull_request OR it's a PR from the same repo.
  # This avoids trying to use repository secrets for forked PRs (which are blocked).
  api-integration-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Database, Auth & Unit Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ secrets.DB_PASSWORD }}' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RacedayDb;User Id=sa;Password=${{ secrets.DB_PASSWORD }};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Secret: "LocalTestingKeyMustBeAtLeast32CharactersLong123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        working-directory: RaceDay.Api
        run: dotnet restore

      - name: Wait for SQL Server to be ready
        shell: bash
        run: |
          set -euo pipefail
          i=0
          until /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1 || [ $i -ge 30 ]; do
            i=$((i+1))
            echo "Waiting for SQL Server to be available... ($i/30)"
            sleep 5
          done
          if [ $i -ge 30 ]; then
            echo "ERROR: SQL Server did not become available in time."
            /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT @@VERSION" || true
            exit 1
          fi
          echo "SQL Server is accepting connections."

      - name: Initialize Database Schema
        shell: bash
        run: |
          set -euo pipefail

          # Try known script locations (prefer repository path used by project, fallback to docs/)
          SQL_SCRIPT="RaceDay.Api/Projectfiles/RacedayDb.sql"
          if [ ! -f "$SQL_SCRIPT" ]; then
            echo "Not found at $SQL_SCRIPT, checking docs/RacedayDb.sql"
            SQL_SCRIPT="docs/RacedayDb.sql"
          fi

          if [ ! -f "$SQL_SCRIPT" ]; then
            echo "ERROR: Database script could not be found in known locations."
            echo "Current directory: $(pwd)"
            echo "Available files:"
            ls -la
            exit 1
          fi

          echo "Initializing database schema using script: $SQL_SCRIPT"

          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -i "$SQL_SCRIPT"

          echo "Database schema initialized successfully."

      - name: Build Solution
        working-directory: RaceDay.Api
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit, Authentication & Integration Tests
        working-directory: RaceDay.Api
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --no-restore \
            --verbosity normal
