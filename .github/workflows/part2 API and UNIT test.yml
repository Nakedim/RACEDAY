name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-integration-tests:
    name: Database, Auth & Unit Testing
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ secrets.DB_PASSWORD }}' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RacedayDb;User Id=sa;Password=${{ secrets.DB_PASSWORD }};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Secret: "LocalTestingKeyMustBeAtLeast32CharactersLong123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        working-directory: RaceDay.Api
        run: dotnet restore

      - name: Initialize Database Schema
        shell: bash
        run: |
          set -euo pipefail

          # Path to your database initialization script
          SQL_SCRIPT="RaceDay.Api/Projectfiles/RacedayDb.sql"
          
          if [ ! -f "$SQL_SCRIPT" ]; then
            echo "ERROR: $SQL_SCRIPT was not found."
            echo "Checking alternative path docs/RacedayDb.sql..."
            SQL_SCRIPT="docs/RacedayDb.sql"
          fi

          if [ ! -f "$SQL_SCRIPT" ]; then
            echo "ERROR: Database script could not be found in known locations."
            echo "Current directory: $(pwd)"
            echo "Available files:"
            ls -la
            exit 1
          fi

          echo "Initializing database schema using script: $SQL_SCRIPT"
          
          # Since the container port 1433 is mapped to the host, we can run sqlcmd directly on the runner host
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -i "$SQL_SCRIPT"

          echo "Database schema initialized successfully."

      - name: Build Solution
        working-directory: RaceDay.Api
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit, Authentication & Integration Tests
        working-directory: RaceDay.Api
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --no-restore \
            --verbosity normal
