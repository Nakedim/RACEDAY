name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Environment variables for the entire job
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.DB_PASSWORD }}
      ConnectionStrings__DefaultConnection: "Server=localhost;Database=TestDb;User Id=sa;Password=${{ secrets.DB_PASSWORD }};"
      ASPNETCORE_ENVIRONMENT: Testing

    services:
      mssql:
        image: ://microsoft.com
        ports:
          - 1433:1433
        # Add the options block here if needed...

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'


      # 3. Confirm SQL Server is ready
      - name: Verify SQL Server connection
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if docker exec \
              "$(docker ps -q \
                --filter ancestor=://microsoft.com \
                | head -n 1)" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C \
              -b \
              -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server ($attempt/30)..."
            sleep 5
          done

          echo "ERROR: SQL Server did not become ready."
          exit 1

      # 4. Generate the database initialization script dynamically via EF Core Migrations
      - name: Generate EF Migrations Script
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing EF Core CLI tools..."
          dotnet tool install --global dotnet-ef

          export PATH="$PATH:$HOME/.dotnet/tools"

          echo "Generating idempotent SQL script in API root..."
          dotnet ef migrations script \
            --project RaceDay.Api/RaceDay.Api.csproj \
            --output RaceDay.Api/RaceDayDB_v2.sql \
            --idempotent

          echo "EF Migrations script generated successfully."

      # 5. Initialize SQL Server database using the runtime generated schema
      - name: Initialize database schema
        shell: bash
        run: |
          set -euo pipefail

          CONTAINER_ID=$(docker ps -q \
            --filter ancestor=://microsoft.com \
            | head -n 1)

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: SQL Server container not found."
            exit 1
          fi

          docker cp "RaceDay.Api/RaceDayDB_v2.sql" \
            "$CONTAINER_ID:/tmp/RaceDayDB_v2.sql"

          docker exec "$CONTAINER_ID" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -i /tmp/RaceDayDB_v2.sql

          echo "Database schema migrated successfully."

      # 6. Restore, build and test the solution or projects
      - name: Restore, build and test
        shell: bash
        run: |
          set -euo pipefail

          # Prefer a solution file if one exists.
          SOLUTION=$(find . -maxdepth 4 \
            \( -name '*.sln' -o -name '*.slnx' \) \
            -print -quit)

          if [ -n "$SOLUTION" ]; then
            echo "Using solution: $SOLUTION"

            dotnet restore "$SOLUTION"

            dotnet build "$SOLUTION" \
              --configuration Release \
              --no-restore

            dotnet test "$SOLUTION" \
              --configuration Release \
              --no-build \
              --no-restore \
              --verbosity normal

          else
            echo "No solution found. Searching for API and test projects."

            API_PROJECT=$(find . -maxdepth 4 \
              -name 'RaceDay.Api.csproj' \
              -print -quit)

            if [ -z "$API_PROJECT" ]; then
              echo "ERROR: RaceDay.Api.csproj was not found."
              find . -maxdepth 4 -name '*.csproj' -print
              exit 1
            fi

            # Restore and build the API.
            dotnet restore "$API_PROJECT"

            dotnet build "$API_PROJECT" \
              --configuration Release \
              --no-restore

            # Find test projects by their project filename.
            mapfile -t TEST_PROJECTS < <(
              find . -maxdepth 5 -name '*Tests.csproj' -print
            )

            if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
              echo "ERROR: No *Tests.csproj project was found."
              echo "Add your test project or update this workflow."
              exit 1
            fi

            for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "Testing project: $TEST_PROJECT"

              dotnet restore "$TEST_PROJECT"

              dotnet build "$TEST_PROJECT" \
                --configuration Release \
                --no-restore

              dotnet test "$TEST_PROJECT" \
                --configuration Release \
                --no-build \
                --no-restore \
                --verbosity normal
            done
          fi
