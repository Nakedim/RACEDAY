name: "Part 2: API, Database & Unit Tests"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  api-integration-tests:
    name: Database, Auth & Unit Testing
    runs-on: ubuntu-latest

    # Spin up an isolated SQL Server 2022 instance alongside the test runner
    services:
      sqlserver:
        image: ://microsoft.com
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourSecurePassword123!"
        ports:
          - 1433:1433
        # Strict health checks ensure the engine is fully initialized before steps begin
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourSecurePassword123!' -C -Q 'SELECT 1'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true # Speeds up execution by caching your NuGet dependencies automatically

      - name: Restore dependencies
        run: dotnet restore

      # Securely registers official Microsoft packaging keys to download standard mssql-tools18
      - name: Install Database Utilities
        run: |
          curl -sSL https://microsoft.com | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://microsoft.com(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      # Seeds the SQL container using your physical schema script
      - name: Initialize Database Schema
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "YourSecurePassword123!" -C -i Projectfiles/RacedayDb.sql

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      # Runs your Controller logic, DTO mappings, and Role Authentication unit tests
      - name: Run Unit & Authentication Tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=RacedayDb;User Id=sa;Password=YourSecurePassword123!;Encrypt=True;TrustServerCertificate=True;"
          Jwt__Secret: "SuperSecretKeyForTestingPurposesOnly123!"
